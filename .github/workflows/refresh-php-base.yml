name: Refresh PHP base images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and check each architecture
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --load --pull --no-cache \
              -f infra/php-runtime-base.Dockerfile --build-arg PHP_VERSION=${{ matrix.php }} \
              -t king-base-check:${{ matrix.php }} .
            docker run --rm --platform "$platform" --entrypoint sh king-base-check:${{ matrix.php }} -c '
              set -eu
              for p in apt libapt-pkg6.0t64; do
                version=$(dpkg-query -W -f="${Version}" "$p")
                dpkg --compare-versions "$version" ge 2.8.4ubuntu0.1
              done
              php -v
            '
          done
      - name: Publish multi-platform base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/php-runtime-base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/intelligent-intern/king-php-base:php${{ matrix.php }}-main
          labels: |
            org.opencontainers.image.title=king-php-base
            org.opencontainers.image.source=https://github.com/Intelligent-Intern/king
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=php${{ matrix.php }}-main
          build-args: PHP_VERSION=${{ matrix.php }}
