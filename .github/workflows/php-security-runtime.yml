name: Build PHP security runtime (ARM64)

on:
  workflow_dispatch:
    inputs:
      php-patch-version:
        description: Official PHP security release
        required: true
        default: '8.4.27'
      php-minor-version:
        description: Existing King runtime PHP minor version
        required: true
        default: '8.4'

permissions:
  contents: read
  packages: write

jobs:
  arm64-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Validate release versions
        env:
          PHP_PATCH: ${{ inputs.php-patch-version }}
          PHP_MINOR: ${{ inputs.php-minor-version }}
        run: |
          [[ "$PHP_PATCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$PHP_MINOR" == "${PHP_PATCH%.*}" ]]
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/php-runtime-security.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/intelligent-intern/king:php${{ inputs.php-patch-version }}-arm64
          build-args: |
            PHP_PATCH_VERSION=${{ inputs.php-patch-version }}
            PHP_MINOR_VERSION=${{ inputs.php-minor-version }}
            KING_RUNTIME_IMAGE=ghcr.io/intelligent-intern/king:php${{ inputs.php-minor-version }}
