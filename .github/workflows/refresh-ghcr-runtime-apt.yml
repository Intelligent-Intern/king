name: Refresh GHCR runtime APT
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify both architectures
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --load --pull \
              -f infra/refresh-published-runtime.Dockerfile \
              --build-arg BASE_IMAGE=ghcr.io/intelligent-intern/king:php${{ matrix.php }} \
              -t king-ghcr-apt-check .
            docker run --rm --platform "$platform" --entrypoint sh king-ghcr-apt-check -c '
              set -eu
              for p in apt libapt-pkg6.0t64; do
                version=$(dpkg-query -W "$p" | cut -f2)
                dpkg --compare-versions "$version" ge 2.8.4ubuntu0.1
              done
              php -r '\''if (phpversion("king") !== "1.0.15-beta") exit(1);'\''
              /opt/king/package/bin/smoke.sh
            '
          done
      - name: Prepare image tags
        id: tags
        run: |
          {
            echo 'tags<<EOF'
            echo 'ghcr.io/intelligent-intern/king:php${{ matrix.php }}'
            echo 'ghcr.io/intelligent-intern/king:sha-b809e30d5a80-php${{ matrix.php }}'
            if [ '${{ matrix.php }}' = '8.5' ]; then
              echo 'ghcr.io/intelligent-intern/king:main'
              echo 'ghcr.io/intelligent-intern/king:latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Publish fixed multi-platform runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/refresh-published-runtime.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: BASE_IMAGE=ghcr.io/intelligent-intern/king:php${{ matrix.php }}
