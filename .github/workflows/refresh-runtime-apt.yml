name: Refresh published runtime APT
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and verify both architectures
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --platform "$platform" --load --pull \
              -f infra/refresh-published-runtime.Dockerfile \
              -t king-runtime-apt-check .
            docker run --rm --platform "$platform" --entrypoint sh king-runtime-apt-check -c '
              set -eu
              for p in apt libapt-pkg6.0t64; do
                version=$(dpkg-query -W "$p" | cut -f2)
                dpkg --compare-versions "$version" ge 2.8.4ubuntu0.1
              done
              php -r '\''if (phpversion("king") !== "1.0.15-beta") exit(1);'\''
              /opt/king/package/bin/smoke.sh
            '
          done
      - name: Publish fixed multi-platform runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/refresh-published-runtime.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            intelligentintern/king:v1.0.15-beta
            intelligentintern/king:php8.5
            intelligentintern/king:iibin2
