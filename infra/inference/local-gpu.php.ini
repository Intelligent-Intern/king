; King local inference profile for the OpenAI-compatible router.
; Loaded by bin/king-openai-router.

king.gpu_bindings_enable=1
king.gpu_default_backend=cuda

king.inference_preferred_model_profile=gpu
; Optional multi-model registry for /v1/models:
; id,backend,artifact,alias1+alias2@id2,backend,artifact,alias
; king.inference_models=gemma4:12b,gpu,${KING_ROOT}/var/inference-models/gemma4-12b.gguf,gemma4
king.inference_cpu_model_name=gemma3:1b
king.inference_cpu_model_artifact=${KING_ROOT}/var/inference-models/gemma3-1b.gguf
king.inference_gpu_model_name=gemma3:1b
king.inference_gpu_model_artifact=${KING_ROOT}/var/inference-models/gemma3-1b.gguf
king.inference_context_tokens=1024
king.inference_kv_page_tokens=16
king.inference_kv_element_bytes=2
king.inference_gpu_max_gpu_layers=99
king.inference_gpu_vram_reserve_mb=512
king.inference_gpu_min_free_vram_mb=256
king.inference_gpu_allow_system_ram_offload=1
king.inference_gpu_system_ram_offload_max_mb=32768
king.inference_gpu_system_ram_offload_min_free_mb=8192
king.inference_with_memory=0
king.inference_llm_cache_enable=0

king.inference_gpu_thermal_sensor_path=
king.inference_gpu_thermal_sensor_command="nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits"
king.inference_gpu_thermal_max_temperature_c=78
king.inference_gpu_thermal_check_interval_sec=15
king.inference_gpu_allow_unmonitored=0
king.inference_gpu_power_sensor_command="nvidia-smi --query-gpu=power.draw --format=csv,noheader,nounits"
king.inference_gpu_power_max_watts=450
king.inference_gpu_power_check_interval_sec=15
king.inference_gpu_batch_prefill_experimental_enable=0
